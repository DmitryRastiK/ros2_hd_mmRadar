/**:
  ros__parameters:
    # Topics configuration
    input_topic: "/hd_radar_0/points/dynamic"
    output_topic: "/hd_radar_0/points/dynamic_f"

    # Filter parameters
    # Each parameter has: enable (bool), min (float), max (float)

    # X coordinate filter (forward direction, meters)
    filter:
      x:
        enable: false # Enable filtering by X coordinate
        min: -100.0 # Minimum X value (meters)
        max: 100.0 # Maximum X value (meters)

      # Y coordinate filter (lateral direction, meters)
      y:
        enable: false # Enable filtering by Y coordinate
        min: -100.0 # Minimum Y value (meters)
        max: 100.0 # Maximum Y value (meters)

      # Z coordinate filter (vertical direction, meters)
      z:
        enable: false # Enable filtering by Z coordinate
        min: -10.0 # Minimum Z value (meters)
        max: 10.0 # Maximum Z value (meters)

      # Filters by absolute value: |v| >= min_abs
      v:
        enable: true # Enable filtering by velocity
        min_abs: 0.2 # Minimum absolute velocity (m/s)

      # Self velocity filter (platform velocity, m/s)
      self_v:
        enable: false # Enable filtering by self velocity
        min: -50.0 # Minimum self velocity (m/s)
        max: 50.0 # Maximum self velocity (m/s)

      # SNR filter (Signal-to-Noise Ratio, dB)
      snr:
        enable: false # Enable filtering by SNR
        min: 10.0 # Minimum SNR (dB) - filter weak signals
        max: 100.0 # Maximum SNR (dB)

      # RCS filter (Radar Cross Section, dBsm)
      rcs:
        enable: true # Enable filtering by RCS
        min: -1.0 # Minimum RCS (dBsm) - filter small targets
        max: 10.0 # Maximum RCS (dBsm)
